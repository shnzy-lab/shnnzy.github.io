<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guns & Games | Дикий Запад Халявы</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body {
            background-color: #1a0f0a;
            /* Каноничный, красочный вестерн-пейзаж */
            background-image: linear-gradient(to bottom, rgba(15, 5, 2, 0.6), rgba(20, 10, 5, 0.95)), url('https://imgur.com');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #f1c40f;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            text-align: center;
            padding: 60px 20px;
            background: linear-gradient(to bottom, rgba(40, 15, 10, 0.95), rgba(15, 5, 2, 0.85));
            border-bottom: 4px double #e74c3c;
            box-shadow: 0 8px 30px rgba(0,0,0,0.9);
        }
        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4.5rem;
            color: #e74c3c;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 8px;
            text-shadow: 3px 3px 0px #000, 0 0 25px rgba(231, 76, 60, 0.6);
        }
        header p {
            font-style: italic;
            color: #f39c12;
            font-size: 1.4rem;
            margin: 15px 0 0 0;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
        }
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 40px;
        }
        .card {
            background: #fcf3cf;
            color: #2c3e50;
            border: 6px solid #2b1a09;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), inset 0 0 40px rgba(0,0,0,0.15);
            padding: 25px;
            text-align: center;
            position: relative;
            /* Плавная анимация покачивания */
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: center;
            cursor: pointer;
        }
        /* Живой эффект взлетающего плаката при наведении */
        .card:hover {
            transform: translateY(-15px) scale(1.04) rotate(-2deg);
            box-shadow: 0 30px 50px rgba(231, 76, 60, 0.6), inset 0 0 40px rgba(0,0,0,0.1);
            border-color: #e74c3c;
        }
        /* Каждый второй плакат отклоняется в другую сторону для живости */
        .card:nth-child(even):hover {
            transform: translateY(-15px) scale(1.04) rotate(2deg);
        }
        .wanted-tag {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 4px;
            margin-bottom: 15px;
            color: #2c3e50;
            border-bottom: 3px dashed #2c3e50;
            padding-bottom: 5px;
        }
        .image-container {
            width: 100%;
            height: 180px;
            overflow: hidden;
            border: 3px solid #2b1a09;
            background: #1a0f0a;
        }
        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }
        .card:hover img {
            transform: scale(1.15);
        }
        .card h3 {
            font-size: 1.3rem;
            margin: 15px 0 10px 0;
            height: 55px;
            overflow: hidden;
            color: #111;
            font-weight: 700;
        }
        .meta {
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            color: #c0392b;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        .btn {
            display: inline-block;
            background: #c0392b;
            color: #fff;
            padding: 14px 30px;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 2px solid #2b1a09;
            box-shadow: 4px 4px 0px #2b1a09;
            transition: all 0.2s ease;
        }
        .card:hover .btn {
            background: #e74c3c;
            box-shadow: 2px 2px 0px #2b1a09;
            transform: translate(2px, 2px);
        }
        footer {
            text-align: center;
            padding: 50px;
            color: #bdc3c7;
            font-size: 0.9rem;
            background: rgba(15, 5, 2, 0.95);
            border-top: 3px solid #e74c3c;
            margin-top: 60px;
        }
    </style>
</head>
<body>

    <header>
        <h1>WANTED GAMES</h1>
        <p>Живыми или мёртвыми. Забирай лучшие раздачи первыми.</p>
    </header>

    <div class="container">
        <div class="grid" id="games-grid"></div>
    </div>

    <footer>
        <p>&copy; 2026 Guns & Games. Работает автоматически под управлением шерифа GitHub.</p>
    </footer>

    <script>
        fetch('data.json')
            .then(res => res.json())
            .then(data => {
                const grid = document.getElementById('games-grid');
                if (!data || data.length === 0) {
                    grid.innerHTML = '<p style="color:#f1c40f; text-align:center; grid-column: 1/-1; font-size: 1.5rem;">На горизонте тихо... Новых раздач пока нет.</p>';
                    return;
                }
                
                data.forEach(game => {
                    const platformLower = game.platforms.toLowerCase();
                    let displayImage = '';
                    
                    // Вшиваем железобетонные ссылки на качественные обложки
                    if (platformLower.includes('epic')) {
                        displayImage = 'https://imgur.com'; // Фирменный арт Epic Games
                    } else if (platformLower.includes('playstation') || platformLower.includes('ps')) {
                        displayImage = 'https://imgur.com'; // Стильный геймпад PS5
                    } else if (platformLower.includes('steam')) {
                        displayImage = 'https://imgur.com'; // Подсветка ПК-сетапа
                    } else if (platformLower.includes('gog')) {
                        displayImage = 'https://imgur.com'; // Ретро-арт
                    } else {
                        displayImage = 'https://imgur.com'; // Общая игровая заглушка
                    }
                    
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="wanted-tag">WANTED</div>
                        <div class="image-container">
                            <img src="${displayImage}" alt="${game.title}">
                        </div>
                        <h3>${game.title}</h3>
                        <div class="meta">Платформа: ${game.platforms}</div>
                        <a href="${game.url}" target="_blank" class="btn">Забрать награду</a>
                    `;
                    grid.appendChild(card);
                });
            })
            .catch(err => {
                document.getElementById('games-grid').innerHTML = '<p style="color:#e74c3c; text-align:center; grid-column:1/-1;">Ошибка загрузки объявлений шерифа.</p>';
            });
    </script>
</body>
</html>
