<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guns & Games | Дикий Запад Халявы</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body {
            background-color: #1a0f0a;
            /* Красочный вестерн-фон с закатом и каньоном */
            background-image: linear-gradient(to bottom, rgba(26, 15, 10, 0.75), rgba(26, 15, 10, 0.95)), url('https://unsplash.com');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #f1c40f;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            text-align: center;
            padding: 60px 20px;
            background: linear-gradient(to bottom, rgba(45, 25, 16, 0.95), rgba(26, 15, 10, 0.85));
            border-bottom: 4px double #e74c3c;
            box-shadow: 0 5px 25px rgba(0,0,0,0.8);
        }
        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            color: #e74c3c;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 6px;
            text-shadow: 3px 3px 0px #000, 0 0 20px rgba(231, 76, 60, 0.4);
        }
        header p {
            font-style: italic;
            color: #f39c12;
            font-size: 1.3rem;
            margin: 15px 0 0 0;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
        }
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 35px;
        }
        .card {
            background: #fcf3cf;
            color: #2c3e50;
            border: 6px solid #2b1a09;
            box-shadow: 0 15px 30px rgba(0,0,0,0.7), inset 0 0 40px rgba(0,0,0,0.15);
            padding: 25px;
            text-align: center;
            position: relative;
            /* Живая анимация взлета и покачивания */
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            transform-origin: center;
            cursor: pointer;
        }
        /* Эффект качающегося от ветра объявления WANTED */
        .card:hover {
            transform: translateY(-12px) scale(1.03) rotate(1.5deg);
            box-shadow: 0 25px 40px rgba(231, 76, 60, 0.5), inset 0 0 40px rgba(0,0,0,0.1);
            border-color: #e74c3c;
        }
        .wanted-tag {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 4px;
            margin-bottom: 15px;
            color: #2c3e50;
            border-bottom: 3px dashed #2c3e50;
            padding-bottom: 5px;
        }
        .image-container {
            width: 100%;
            height: 180px;
            overflow: hidden;
            border: 3px solid #2b1a09;
            background: #1a0f0a;
            position: relative;
        }
        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .card:hover img {
            transform: scale(1.1);
        }
        .card h3 {
            font-size: 1.3rem;
            margin: 15px 0 10px 0;
            height: 55px;
            overflow: hidden;
            color: #111;
            font-weight: 700;
        }
        .meta {
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            color: #c0392b;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        .btn {
            display: inline-block;
            background: #c0392b;
            color: #fff;
            padding: 14px 30px;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 2px solid #2b1a09;
            box-shadow: 4px 4px 0px #2b1a09;
            transition: all 0.2s ease;
        }
        .card:hover .btn {
            background: #e74c3c;
            box-shadow: 2px 2px 0px #2b1a09;
            transform: translate(2px, 2px);
        }
        footer {
            text-align: center;
            padding: 50px;
            color: #bdc3c7;
            font-size: 0.9rem;
            background: rgba(26, 15, 10, 0.95);
            border-top: 3px solid #e74c3c;
            margin-top: 60px;
        }
    </style>
</head>
<body>

    <header>
        <h1>WANTED GAMES</h1>
        <p>Живыми или мёртвыми. Забирай лучшие раздачи первыми.</p>
    </header>

    <div class="container">
        <div class="grid" id="games-grid">
            <!-- Сюда скрипт выведет игры автоматически -->
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Guns & Games. Работает автоматически под управлением шерифа GitHub.</p>
    </footer>

    <script>
        // Подключаемся к вашей личной базе данных игр
        fetch('https://github.io')
            .then(res => res.json())
            .then(data => {
                const grid = document.getElementById('games-grid');
                if (!data || data.length === 0) {
                    grid.innerHTML = '<p style="color:#f1c40f; text-align:center; grid-column: 1/-1; font-size: 1.5rem;">На горизонте тихо... Новых раздач пока нет.</p>';
                    return;
                }
                
                data.forEach(game => {
                    // Красивые стилизованные вестерн-заглушки для картинок в зависимости от магазина
                    let fallbackImage = 'https://unsplash.com';
                    const platformLower = game.platforms.toLowerCase();
                    
                    if (platformLower.includes('epic')) {
                        fallbackImage = 'https://unsplash.com'; // Эпичная игровая зона
                    } else if (platformLower.includes('steam')) {
                        fallbackImage = 'https://unsplash.com'; // Классический ПК сетап
                    } else if (platformLower.includes('gog')) {
                        fallbackImage = 'https://unsplash.com'; // Олдскульный замок/ретро
                    }
                    
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="wanted-tag">WANTED</div>
                        <div class="image-container">
                            <img src="${game.image}" onerror="this.onerror=null; this.src='${fallbackImage}';" alt="${game.title}">
                        </div>
                        <h3>${game.title}</h3>
                        <div class="meta">Платформа: ${game.platforms}</div>
                        <a href="${game.url}" target="_blank" class="btn">Забрать награду</a>
                    `;
                    grid.appendChild(card);
                });
            })
            .catch(err => {
                document.getElementById('games-grid').innerHTML = '<p style="color:#e74c3c; text-align:center; grid-column:1/-1;">Ошибка загрузки объявлений шерифа.</p>';
            });
    </script>
</body>
</html>
