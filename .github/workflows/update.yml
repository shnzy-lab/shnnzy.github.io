name: Auto Update Games
on:
  schedule:
    - cron: '0 */3 * * *' # Запуск каждые 3 часа
  workflow_dispatch: # Позволяет запускать вручную кнопку в панели

permissions:
  contents: write

jobs:
  update-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run update script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/update_games.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "shnzy-lab-bot"
          git config --global user.email "bot@github.com"
          for f in data.json notified.json subscribers.json telegram_offset.json; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done
          git diff --quiet && git diff --staged --quiet || git commit -m "Шериф обновил список раздач [skip ci]"
          git push
